<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Strips</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <!-- container -->
        <div class="container">
            <!-- strip 1 -->
            <div class="strip">
                <!-- strip title -->
                <h2 class="strip__title bg-forestgreen">Relax</h2>
                <!-- strip img -->
                <div class="strip__img">
                    <img
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop"
                        alt="Relax"
                    />
                </div>
            </div>
            <!-- strip 2 -->
            <div class="strip">
                <!-- strip title -->
                <h2 class="strip__title bg-khaki">Explore</h2>
                <!-- strip img -->
                <div class="strip__img">
                    <img
                        src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&h=600&fit=crop"
                        alt="Explore"
                    />
                </div>
            </div>
            <!-- strip 3 -->
            <div class="strip">
                <!-- strip title -->
                <h2 class="strip__title bg-dodgerblue">Travel</h2>
                <!-- strip img -->
                <div class="strip__img">
                    <img
                        src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800&h=600&fit=crop"
                        alt="Travel"
                    />
                </div>
            </div>
            <!-- strip 4 -->
            <div class="strip">
                <!-- strip title -->
                <h2 class="strip__title bg-orange">Achieve</h2>
                <!-- strip img -->
                <div class="strip__img">
                    <img
                        src="https://images.unsplash.com/photo-1484589065579-248aad0d8b13?w=800&h=600&fit=crop"
                        alt="Achieve"
                    />
                </div>
            </div>
            <!-- strip 5 -->
            <div class="strip">
                <!-- strip title -->
                <h2 class="strip__title bg-violet">Dare</h2>
                <!-- strip img -->
                <div class="strip__img">
                    <img
                        src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop"
                        alt="Dare"
                    />
                </div>
            </div>
            <!-- overlay -->
            <div class="overlay"></div>
        </div>
    </body>
</html>
