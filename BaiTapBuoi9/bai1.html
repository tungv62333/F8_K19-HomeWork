<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 1</title>
        <style>
            table {
                border-spacing: 16px;
            }
            td {
                vertical-align: bottom;
                text-align: left;
            }
            /* 1. Hình vuông */
            .square {
                width: 100px;
                height: 100px;
                background-color: white;
                border: 4px solid rgb(196, 95, 13);
            }

            /* 2. Hình chữ nhật */
            .rectangle {
                width: 200px;
                height: 100px;
                background-color: white;
                border: 4px solid rgb(45, 100, 219);
            }

            /* 3. Tam giác lên */
            .triangle-up {
                width: 0;
                height: 0;
                border-right: 50px solid transparent;
                border-bottom: 100px solid rgb(21, 196, 108);
                border-left: 50px solid transparent;
            }

            /* 4. Tam giác xuống */
            .triangle-down {
                width: 0;
                height: 0;
                border-top: 100px solid rgb(248, 203, 0);
                border-right: 50px solid transparent;
                border-left: 50px solid transparent;
            }

            /* 5. Tam giác trái */
            .triangle-left {
                width: 0;
                height: 0;
                border-top: 50px solid transparent;
                border-right: 100px solid rgb(132, 0, 165);
                border-bottom: 50px solid transparent;
            }

            /* 6. Tam giác phải */
            .triangle-right {
                width: 0;
                height: 0;
                border-top: 50px solid transparent;
                border-bottom: 50px solid transparent;
                border-left: 100px solid rgb(185, 118, 29);
            }

            /* 7. Hình thang */
            .trapezoid {
                width: 120px;
                height: 0;
                border-right: 30px solid transparent;
                border-bottom: 100px solid rgb(38, 201, 133);
                border-left: 30px solid transparent;
            }

            /* 8. Tam giác rộng */
            .triangle-wide {
                width: 0;
                height: 0;
                border-right: 100px solid transparent;
                border-bottom: 50px solid rgb(14, 44, 78);
                border-left: 100px solid transparent;
            }

            /* 9. Tam giác nhọn */
            .triangle-acute {
                width: 0;
                height: 0;
                border-right: 30px solid transparent;
                border-bottom: 100px solid rgb(105, 23, 9);
                border-left: 30px solid transparent;
            }

            /* 10. Tam giác cân */
            .triangle-isosceles {
                width: 0;
                height: 0;
                border-right: 60px solid transparent;
                border-bottom: 100px solid rgb(211, 120, 1);
                border-left: 60px solid transparent;
            }

            /* 11. Mũi tên phải */
            .arrow-right {
                width: 0;
                height: 0;
                border-top: 40px solid transparent;
                border-bottom: 40px solid transparent;
                border-left: 80px solid rgb(24, 170, 97);
            }

            /* 12. Mũi tên trái */
            .arrow-left {
                width: 0;
                height: 0;
                border-top: 40px solid transparent;
                border-right: 80px solid rgb(108, 10, 146);
                border-bottom: 40px solid transparent;
            }

            /* 13. Ribbon  */
            .ribbon {
                width: 180px;
                height: 100px;
                background-color: rgb(175, 53, 9);
            }
            .ribbon-inner {
                width: 0;
                height: 0;
                margin-left: auto;
                border-top: 50px solid transparent;
                border-right: 50px solid white;
                border-bottom: 50px solid transparent;
            }

            /* 14. F8 */
            .f8-f {
                display: inline-block;
                width: 80px;
                height: 160px;
                border-top: 30px solid rgb(209, 88, 65);
                border-left: 30px solid rgb(209, 88, 65);
            }
            .f8-f .f8-f-inner {
                width: 80px;
                height: 30px;
                background-color: rgb(209, 88, 65);
                margin-top: 40px;
            }
            .f8-8 {
                display: inline-block;
                width: 50px;
                height: 130px;
                border: 30px solid rgb(209, 88, 65);
            }
            .f8-8 .f8-8-inner {
                width: 80px;
                height: 30px;
                background-color: rgb(209, 88, 65);
                margin-top: 40px;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <td>
                    <!-- 1. Hình vuông -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="square"></div>
                        </div>
                        <p class="geometry-caption">1. Hình vuông</p>
                    </div>
                </td>
                <td>
                    <!-- 2. Hình chữ nhật -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="rectangle"></div>
                        </div>
                        <p class="geometry-caption">2. Hình chữ nhật</p>
                    </div>
                </td>
                <td>
                    <!-- 3. Tam giác lên -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-up"></div>
                        </div>
                        <p class="geometry-caption">3. Tam giác lên</p>
                    </div>
                </td>
                <td>
                    <!-- 4. Tam giác xuống -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-down"></div>
                        </div>
                        <p class="geometry-caption">4. Tam giác xuống</p>
                    </div>
                </td>
                <td>
                    <!-- 5. Tam giác trái  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-left"></div>
                        </div>
                        <p class="geometry-caption">5. Tam giác trái</p>
                    </div>
                </td>
                <td>
                    <!-- 6. Tam giác phải  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-right"></div>
                        </div>
                        <p class="geometry-caption">6. Tam giác phải</p>
                    </div>
                </td>
                <td>
                    <!-- 7. Hình thang  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="trapezoid"></div>
                        </div>
                        <p class="geometry-caption">7. Hình thang</p>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 8. Tam giác rộng  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-wide"></div>
                        </div>
                        <p class="geometry-caption">8. Tam giác rộng</p>
                    </div>
                </td>
                <td>
                    <!-- 9. Tam giác nhọn  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-acute"></div>
                        </div>
                        <p class="geometry-caption">9. Tam giác nhọn</p>
                    </div>
                </td>
                <td>
                    <!-- 10. Tam giác cân -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="triangle-isosceles"></div>
                        </div>
                        <p class="geometry-caption">10. Tam giác cân</p>
                    </div>
                </td>
                <td>
                    <!-- 11. Mũi tên phải -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="arrow-right"></div>
                        </div>
                        <p class="geometry-caption">11. Mũi tên phải</p>
                    </div>
                </td>
                <td>
                    <!-- 12. Mũi tên trái  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="arrow-left"></div>
                        </div>
                        <p class="geometry-caption">12. Mũi tên trái</p>
                    </div>
                </td>
                <td colspan="2">
                    <!-- 13. Ribbon  -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="ribbon">
                                <div class="ribbon-inner"></div>
                            </div>
                        </div>
                        <p class="geometry-caption">13. Ribbon/Lá cờ</p>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="7">
                    <!-- 14. F8 -->
                    <div class="geometry-figure">
                        <div class="geometry-diagram">
                            <div class="f8">
                                <div class="f8-f">
                                    <div class="f8-f-inner"></div>
                                </div>
                                <div class="f8-8">
                                    <div class="f8-8-inner"></div>
                                </div>
                            </div>
                        </div>
                        <p class="geometry-caption">14. F8</p>
                    </div>
                </td>
            </tr>
        </table>
    </body>
</html>
